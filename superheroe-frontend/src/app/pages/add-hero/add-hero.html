<div class="page-center-container">
  <div class="custom-card">
    <h2>⚡ Nuevo Superhéroe</h2>
    <p class="subtitle">Agrega un nuevo integrante al catálogo global</p>

    <form (ngSubmit)="guardarHeroe()">
      <div class="form-group">
        <label for="nombre">Nombre del Héroe *</label>
        <input type="text" id="nombre" name="nombre" [(ngModel)]="nuevoHeroe.nombre" required placeholder="Ej. Green Lantern">
      </div>

      <div class="form-group">
        <label for="poder">Poder Principal *</label>
        <input type="text" id="poder" name="poder" [(ngModel)]="nuevoHeroe.poder" required placeholder="Ej. Anillo de energía">
      </div>

      <div class="form-group">
        <label for="imagen_url">Nombre del archivo de imagen</label>
        <input
          type="text"
          id="imagen_url"
          name="imagen_url"
          disabled
          [placeholder]="nuevoHeroe.nombre ? (nuevoHeroe.nombre.toLowerCase().replace(' ', '')) + '.png' : 'Ej. joelevil.png'">
      </div>

      <div style="display: flex; gap: 15px; margin-top: 25px;">
        <button type="button" class="btn-danger-custom" (click)="cancelar()">Cancelar</button>
        <button type="submit" class="btn-primary-custom">Guardar 💾</button>
      </div>
    </form>
  </div>
</div>
